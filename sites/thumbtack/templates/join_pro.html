{% extends 'base.html' %}
{% block title %}Join as a pro - Thumbtack{% endblock %}
{% block content %}
<div class="page page-narrow">
  <h1>Join as a pro</h1>
  <p class="muted">Millions of customers come to Thumbtack to find pros like you.</p>
  <div class="auth-card">
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-row"><label>Business name</label><input type="text" name="name" required></div>
      <div class="form-row"><label>Email</label><input type="email" name="email" required></div>
      <div class="form-row"><label>Phone</label><input type="text" name="phone" required></div>
      <div class="form-row"><label>Zip code</label><input type="text" name="zip" required></div>
      <div class="form-row">
        <label>What service do you offer?</label>
        <select name="category_id" required>
          {% for c in cats %}<option value="{{ c.id }}">{{ c.name }}</option>{% endfor %}
        </select>
      </div>
      <button class="btn btn-primary btn-block" type="submit">Create my pro account</button>
    </form>
  </div>
</div>
{% endblock %}
