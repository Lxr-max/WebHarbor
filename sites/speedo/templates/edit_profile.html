{% extends 'base.html' %}
{% block title %}Profile | Speedo{% endblock %}
{% block content %}
<div class="page-width account-layout">
  <aside class="account-nav">
    <h2>My Account</h2>
    <ul>
      <li><a href="{{ url_for('account') }}">Orders</a></li>
      <li><a class="active" href="{{ url_for('account_profile') }}">Profile</a></li>
      <li><a href="{{ url_for('account_addresses') }}">Addresses</a></li>
      <li><a href="{{ url_for('account_payment') }}">Payment Methods</a></li>
      <li><a href="{{ url_for('account_wishlist') }}">Wishlist</a></li>
      <li>
        <form method="post" action="{{ url_for('logout') }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <button type="submit" class="link-btn">Sign Out</button>
        </form>
      </li>
    </ul>
  </aside>
  <section class="account-main">
    <h1>Profile</h1>
    <p class="account-sub">Update your personal details.</p>
    <form method="post" class="auth-card" style="margin:0;max-width:520px;">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="field"><label for="name">Full name</label>
        <input type="text" id="name" name="name" value="{{ current_user.name }}" required></div>
      <div class="field"><label for="phone">Phone</label>
        <input type="tel" id="phone" name="phone" value="{{ current_user.phone }}"></div>
      <div class="field"><label>Email</label>
        <input type="email" value="{{ current_user.email }}" disabled></div>
      <label style="font-size:13.5px;display:flex;gap:8px;align-items:center;margin:10px 0;">
        <input type="checkbox" name="accepts_marketing" {% if current_user.accepts_marketing %}checked{% endif %}>
        Email me news and offers from Speedo
      </label>
      <button type="submit" class="btn btn-primary">Save changes</button>
    </form>
  </section>
</div>
{% endblock %}
