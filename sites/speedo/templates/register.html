{% extends 'base.html' %}
{% block title %}Register | Speedo{% endblock %}
{% block content %}
<div class="auth-card">
  <h1>Create Account</h1>
  <form method="post" action="/register">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="field"><label for="name">Full name</label>
      <input type="text" id="name" name="name" required value="{{ form.get('name','') }}"></div>
    <div class="field"><label for="email">Email</label>
      <input type="email" id="email" name="email" required value="{{ form.get('email','') }}"></div>
    <div class="field"><label for="password">Password (at least 8 characters)</label>
      <input type="password" id="password" name="password" required></div>
    <button type="submit" class="btn btn-primary" style="width:100%;">Create account</button>
  </form>
  <p style="margin-top:16px;font-size:13.5px;">Already registered? <a href="/login" style="text-decoration:underline;">Sign in</a></p>
</div>
{% endblock %}
