{% extends 'base.html' %}
{% block title %}Log in | Airbnb{% endblock %}
{% block content %}
<div class="form-card">
  <h1>Log in</h1>
  {% if error %}<div class="err">{{ error }}</div>{% endif %}
  <p class="muted small">Benchmark demo accounts: alice.j@test.com, bob.c@test.com, carol.d@test.com, dana.k@test.com — password TestPass123!</p>
  <form method="post" action="{{ url_for('login', next=request.args.get('next', '')) }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="email">Email</label>
    <input type="email" id="email" name="email" required placeholder="you@example.com">
    <label for="password">Password</label>
    <input type="password" id="password" name="password" required>
    <br>
    <button class="btn btn-rausch btn-lg" type="submit">Log in</button>
  </form>
  <p class="small">New here? <a href="{{ url_for('signup') }}">Sign up</a></p>
</div>
{% endblock %}
