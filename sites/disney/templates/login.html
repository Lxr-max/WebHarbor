{% extends 'base.html' %}
{% block title %}Log In | Disney{% endblock %}
{% block content %}
<div class="auth-card">
  <h1>Log In</h1>
  {% if error %}<p class="form-error">{{ error }}</p>{% endif %}
  <form method="post" action="{{ url_for('login', next=request.args.get('next','')) }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-row">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" value="{{ request.form.get('email','') }}">
    </div>
    <div class="form-row">
      <label for="password">Password</label>
      <input type="password" id="password" name="password">
    </div>
    <button class="btn" type="submit">Log In</button>
  </form>
  <p class="form-note" style="margin-top:16px">New to Disney? <a href="{{ url_for('signup') }}" style="color:var(--disney-blue)">Create an account</a></p>
</div>
{% endblock %}
