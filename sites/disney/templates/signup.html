{% extends 'base.html' %}
{% block title %}Create Account | Disney{% endblock %}
{% block content %}
<div class="auth-card">
  <h1>Create Account</h1>
  {% if error %}<p class="form-error">{{ error }}</p>{% endif %}
  <form method="post" action="{{ url_for('signup') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-row">
      <label for="name">Full name</label>
      <input type="text" id="name" name="name" value="{{ request.form.get('name','') }}">
    </div>
    <div class="form-row">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" value="{{ request.form.get('email','') }}">
    </div>
    <div class="form-row">
      <label for="password">Password (8+ characters)</label>
      <input type="password" id="password" name="password">
    </div>
    <button class="btn" type="submit">Create Account</button>
  </form>
  <p class="form-note" style="margin-top:16px">Already have an account? <a href="{{ url_for('login') }}" style="color:var(--disney-blue)">Log in</a></p>
</div>
{% endblock %}
