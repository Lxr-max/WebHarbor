{% extends "base.html" %}
{% block title %}Create Account | Ticketmaster{% endblock %}
{% block content %}
<div class="container">
  <div class="auth-wrap">
    <div class="auth-card">
      <h1>Create Account</h1>
      <p class="sub">Get personalized recommendations, presale access and faster checkout.</p>
      <form method="post">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="field">
          <label for="first_name">First name</label>
          <input id="first_name" type="text" name="first_name" required>
        </div>
        <div class="field">
          <label for="last_name">Last name</label>
          <input id="last_name" type="text" name="last_name" required>
        </div>
        <div class="field">
          <label for="email">Email address</label>
          <input id="email" type="email" name="email" required placeholder="Email address">
        </div>
        <div class="field">
          <label for="password">Password (8+ characters)</label>
          <input id="password" type="password" name="password" minlength="8" required>
        </div>
        <button class="btn btn-primary btn-wide" type="submit">Create Account</button>
      </form>
      <p class="auth-alt">Already have an account? <a href="/signin">Sign in</a></p>
    </div>
  </div>
</div>
{% endblock %}
