{% extends 'base.html' %}
{% block title %}Create Profile{% endblock %}
{% block content %}
<div class="pagehead"><h1>Create Profile</h1></div>
<div class="card" style="max-width:520px">
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" class="stack">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="name">Full name</label>
    <input type="text" id="name" name="name" required value="{{ request.form.get('name', '') }}">
    <label for="email">Email address</label>
    <input type="email" id="email" name="email" required value="{{ request.form.get('email', '') }}">
    <label for="password">Password (at least 8 characters)</label>
    <input type="password" id="password" name="password" required>
    <button class="btn" type="submit">Create account</button>
  </form>
  <p class="small muted">Already registered? <a href="{{ url_for('login') }}">Login</a>.</p>
</div>
{% endblock %}
