{% extends "base.html" %}
{% block title %}Sign In{% endblock %}
{% block content %}
<div class="container container--narrow">
  <h1 class="page-title">Sign in to your USCIS online account</h1>
  {% if error %}<div class="alert-box alert-box--error"><p>{{ error }}</p></div>{% endif %}
  <form class="usa-form" method="post" action="{{ url_for('account_login', next=request.args.get('next')) }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label class="form-label" for="email"><span class="form-label__title">Email address</span></label>
    <input id="email" name="email" type="email" required autocomplete="username">
    <label class="form-label" for="password"><span class="form-label__title">Password</span></label>
    <input id="password" name="password" type="password" required autocomplete="current-password">
    <button class="btn btn--primary" type="submit">Sign in</button>
  </form>
  <p>New user? <a href="{{ url_for('account_register') }}">Create an account</a>.</p>
  <p><a href="{{ url_for('appointment_landing') }}">Back to My Appointment</a> &middot; <a href="{{ url_for('home') }}">Back to USCIS.gov</a></p>
</div>
{% endblock %}
