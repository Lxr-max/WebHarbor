{% extends "base.html" %}
{% block title %}Create a USCIS Online Account{% endblock %}
{% block content %}
<div class="container container--narrow">
  <h1 class="page-title">Create a USCIS online account</h1>
  {% if error %}<div class="alert-box alert-box--error"><p>{{ error }}</p></div>{% endif %}
  <form class="usa-form" method="post" action="{{ url_for('account_register') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label class="form-label" for="display_name"><span class="form-label__title">Full name</span></label>
    <input id="display_name" name="display_name" type="text" required>
    <label class="form-label" for="email"><span class="form-label__title">Email address</span></label>
    <input id="email" name="email" type="email" required>
    <label class="form-label" for="password"><span class="form-label__title">Password (at least 8 characters)</span></label>
    <input id="password" name="password" type="password" minlength="8" required>
    <button class="btn btn--primary" type="submit">Create account</button>
  </form>
  <p>Already have an account? <a href="{{ url_for('account_login') }}">Sign in</a>.</p>
</div>
{% endblock %}
