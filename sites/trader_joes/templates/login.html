{% extends 'base.html' %}
{% block title %}Log In{% endblock %}
{% block content %}
<div class="form-card">
  <h2>Log In</h2>
  <p class="rich">Log in to keep your Shopping List and your My Store preference between visits.</p>
  <form method="post" action="{{ url_for('login') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="email">Email</label>
    <input type="email" id="email" name="email" value="{{ email }}" required>
    <label for="password">Password</label>
    <input type="password" id="password" name="password" required>
    <button class="btn" type="submit">LOG IN</button>
  </form>
  {% if error %}<p class="form-error">{{ error }}</p>{% endif %}
  <p class="rich" style="margin-top:14px;">New here? <a href="{{ url_for('signup') }}">Create an account</a></p>
</div>
{% endblock %}
