{% extends 'base.html' %}
{% block title %}Sign Up{% endblock %}
{% block content %}
<div class="form-card">
  <h2>Create an account</h2>
  <p class="rich">Keep your Shopping List and your My Store preference between visits.</p>
  <form method="post" action="{{ url_for('signup') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="name">Name</label>
    <input type="text" id="name" name="name" value="{{ name }}">
    <label for="email">Email</label>
    <input type="email" id="email" name="email" value="{{ email }}" required>
    <label for="password">Password (at least 8 characters)</label>
    <input type="password" id="password" name="password" required>
    <button class="btn" type="submit">SIGN UP</button>
  </form>
  {% if error %}<p class="form-error">{{ error }}</p>{% endif %}
  <p class="rich" style="margin-top:14px;">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
</div>
{% endblock %}
