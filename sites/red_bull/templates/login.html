{% extends 'base.html' %}
{% block title %}Log in | Red Bull{% endblock %}
{% block content %}
<h1 class="page-title">Log in to your Red Bull account</h1>
<p class="page-sub">Access your orders, event registrations and favorites.</p>

<div class="form-card">
  {% if error %}
  <div class="form-errors"><p>{{ error }}</p></div>
  {% endif %}
  <form method="post" action="{{ url_for('account_login') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="email">Email address</label>
    <input id="email" name="email" type="email" value="{{ email }}" required>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" required>
    <p style="margin-top:16px"><button type="submit" class="btn btn-red">Log in</button></p>
  </form>
</div>
{% endblock %}
