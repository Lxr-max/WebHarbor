{% extends 'base.html' %}
{% block title %}Register - The Weather Network{% endblock %}
{% block content %}
<div class="auth-card">
  <h1>Create your account</h1>
  {% if error %}<div class="err">{{ error }}</div>{% endif %}
  <form method="post" action="/en/account/register">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="username">Username</label>
    <input type="text" id="username" name="username" value="{{ form.get('username','') if form else '' }}" required>
    <label for="display_name">Display name</label>
    <input type="text" id="display_name" name="display_name" value="{{ form.get('display_name','') if form else '' }}">
    <label for="email">Email</label>
    <input type="email" id="email" name="email" value="{{ form.get('email','') if form else '' }}" required>
    <label for="password">Password (8+ characters)</label>
    <input type="password" id="password" name="password" required>
    <div style="margin-top:18px">
      <button class="btn" type="submit">Register</button>
    </div>
  </form>
  <p class="alt">Already have an account? <a href="/en/account/sign-in" style="color:#1a5fa8">Sign in</a></p>
</div>
{% endblock %}
