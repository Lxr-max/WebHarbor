{% extends 'base.html' %}
{% block title %}Log in — Wanderlog{% endblock %}
{% block body %}
<div class="wrap">
  <div class="card" style="max-width:460px;margin:30px auto">
    <h1>Log in to Wanderlog</h1>
    <p class="muted small">Plan trips with itineraries, maps, budgets, checklists and friends.</p>
    <form method="post" action="{{ url_for('login') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required>
      <label for="password">Password</label>
      <input type="password" id="password" name="password" required>
      <p style="margin-top:14px"><button class="btn btn-primary" type="submit">Log in</button></p>
    </form>
    <p class="small muted">New to Wanderlog? <a href="{{ url_for('register') }}">Create an account</a>.</p>
  </div>
</div>
{% endblock %}
