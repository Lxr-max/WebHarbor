{% extends 'base.html' %}
{% block title %}Sign up — Wanderlog{% endblock %}
{% block body %}
<div class="wrap">
  <div class="card" style="max-width:480px;margin:30px auto">
    <h1>Create your Wanderlog account</h1>
    <p class="muted small">One app for all your travel planning needs.</p>
    <form method="post" action="{{ url_for('register') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required>
      <label for="username">Username</label>
      <input type="text" id="username" name="username" required pattern="[A-Za-z0-9_]{3,30}">
      <label for="display_name">Display name</label>
      <input type="text" id="display_name" name="display_name">
      <label for="password">Password (8+ characters)</label>
      <input type="password" id="password" name="password" required minlength="8">
      <p style="margin-top:14px"><button class="btn btn-primary" type="submit">Sign up</button></p>
    </form>
    <p class="small muted">Already have an account? <a href="{{ url_for('login') }}">Log in</a>.</p>
  </div>
</div>
{% endblock %}
