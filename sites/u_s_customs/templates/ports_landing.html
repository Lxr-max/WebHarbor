{% extends 'base.html' %}
{% block content %}
<div class="breadcrumb"><a href="{{ url_for('home') }}">Home</a> › About CBP › {{ page.title }}</div>
<h1 class="page-title">Locate a Port of Entry</h1>
<div class="content-lines">
  {% for line in page.lines %}<p>{{ line }}</p>{% endfor %}
</div>
<form class="filters" method="get" action="{{ url_for('ports_search') }}">
  <div class="field"><label for="q">Search ports by name, code or city</label>
    <input id="q" type="search" name="q" placeholder="e.g. Calexico, 2504, Detroit"></div>
  <button class="btn" type="submit">Search</button>
</form>
<h2>Browse by State or Territory</h2>
<ul>
  {% for code, name, n in states %}
  <li style="display:inline-block; min-width:230px;"><a href="{{ url_for('ports_state', state=code) }}">{{ name }}</a> ({{ n }})</li>
  {% endfor %}
</ul>
{% endblock %}
