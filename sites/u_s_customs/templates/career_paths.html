{% extends 'base.html' %}
{% block content %}
<h1 class="page-title">Career Paths</h1>
<p>Whatever your background, there's a place for you at CBP. Explore the career paths below.</p>
<div class="home-cards">
  {% for p in paths %}
  <div class="card"><div class="card-body">
    <h3><a href="{{ url_for('career_path', slug=p.slug) }}">{{ p.title }}</a></h3>
    <p>{{ p.description }}</p>
  </div></div>
  {% endfor %}
</div>
{% endblock %}
