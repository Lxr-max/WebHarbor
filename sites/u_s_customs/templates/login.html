{% extends 'base.html' %}
{% block content %}
<h1 class="page-title">Log in</h1>
<p>Sign in to manage ESTA applications, Trusted Traveler Program applications and saved border crossings, ports and jobs.</p>
<form class="stack" method="post" style="max-width:460px">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label for="email">Email address</label>
  <input id="email" name="email" type="email" required>
  <label for="password">Password</label>
  <input id="password" name="password" type="password" required>
  <button class="btn" type="submit" style="margin-top:1rem;">Log in</button>
</form>
{% endblock %}
