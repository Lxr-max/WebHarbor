{% extends 'base.html' %}
{% block content %}
<div class="breadcrumb"><a href="{{ url_for('home') }}">Home</a> › Travel › {{ page.title }}</div>
<h1 class="page-title">{{ page.title }}</h1>
<div class="content-lines">
  {% for line in page.lines %}<p>{{ line }}</p>{% endfor %}
</div>
<div class="callout">
  <p><strong>Border Wait Times:</strong> view current estimated wait times at {{ crossings }} U.S. land-border crossings.</p>
  <p><a class="btn" href="{{ url_for('bwt') }}">View Border Wait Times</a></p>
</div>
{% endblock %}
