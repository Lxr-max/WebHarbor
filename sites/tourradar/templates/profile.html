{% extends 'base.html' %}
{% block title %}Profile - TourRadar{% endblock %}
{% block content %}
<div class="container" style="padding: 22px 16px 60px; max-width:760px;">
  <div class="crumbs"><a href="/">Home</a> &nbsp;&#8805;&nbsp; <a href="/account">My Account</a> &nbsp;&#8805;&nbsp; Profile</div>
  <h1>Profile settings</h1>
  <div class="panel">
    <form method="post" class="form-grid">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="field">
        <label>Full name</label>
        <input name="display_name" value="{{ current_user.display_name }}" required>
      </div>
      <div class="field">
        <label>Email</label>
        <input value="{{ current_user.email }}" disabled>
      </div>
      <div class="field">
        <label>Phone</label>
        <input name="phone" value="{{ current_user.phone or '' }}">
      </div>
      <div class="field">
        <label>Nationality</label>
        <select name="nationality">
          <option value="">Select</option>
          {% for nat in ['USA', 'United Kingdom', 'Australia', 'Canada', 'New Zealand', 'Germany', 'France', 'Japan'] %}
          <option value="{{ nat }}" {% if current_user.nationality == nat %}selected{% endif %}>{{ nat }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="field full">
        <button class="btn" type="submit">Save changes</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
