{% extends "base.html" %}
{% block title %}Log in | Statista{% endblock %}
{% block content %}
<div class="formCard">
  <h1>Log in</h1>
  <p class="sub">Welcome back. Please enter your details.</p>
  <form method="post" action="/login{% if request.args.get('next') %}?next={{ request.args.get('next')|urlencode }}{% endif %}">
    <div class="field">
      <label for="email">Username or Email address *</label>
      <input id="email" name="email" type="text" required>
      <p class="hint">Email address or username is required</p>
    </div>
    <div class="field">
      <label for="password">Password *</label>
      <input id="password" name="password" type="password" required>
      <p class="hint"><a href="/contact/">Forgot password?</a></p>
    </div>
    <button class="btn btn--primary loginSubmit" type="submit" style="width:100%;">Log in</button>
  </form>
  <p class="formNote">No account yet? <a href="/register">Register now</a></p>
</div>
{% endblock %}
